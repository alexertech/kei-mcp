name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ 22, 24 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Plugin pins the package version
        run: node -e "const p=require('./package.json').version,m=require('./.claude-plugin/plugin.json');if(m.version!==p||!m.mcpServers.kei.args.includes('kei-mcp@'+p)){console.error('plugin.json version/pin must equal package.json '+p);process.exit(1)}"
      - run: npm run build
      - run: npx vitest run
      - run: npm audit --omit=dev --audit-level=high
